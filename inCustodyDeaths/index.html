<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deaths in Illinois county jail custody</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
html, body { margin: 0; padding: 0; background-color: transparent; }
</style>
</head>
<body>
<div id="iap-custody-dots" data-csv="inCustodyDeaths.csv" data-photo-base="photos">
<style>
#iap-custody-dots {
    --ground: #FFFFFF;
    --parchment: #E9ECEE;
    --ink: #1F161A;
    --ink-muted: #574F54;
    --maroon: #8A2C38;
    --steel: #6F8590;
    --sage: #788570;
    --rule: 2px solid var(--ink);
    --sans: "halyard-display", "Halyard Display", "Inter", ui-sans-serif, "Helvetica Neue", Arial, sans-serif;
    --sans-sm: "halyard-text", "Halyard Text", "Inter", ui-sans-serif, "Helvetica Neue", Arial, sans-serif;
    --t-micro: .6875rem;
    --t-small: .8125rem;
    --t-ui: .9375rem;
    max-width: 640px;
    margin: 0 auto;
    padding: 20px 20px 30px 20px;
    box-sizing: border-box;
    background: transparent;
    color: var(--ink);
    font-family: var(--sans-sm);
    -webkit-font-smoothing: antialiased;
}
#iap-custody-dots *, #iap-custody-dots *::before, #iap-custody-dots *::after { box-sizing: border-box; }
#iap-custody-dots h1 {
    font-family: var(--sans);
    font-size: 22px;
    font-weight: 700;
    line-height: 1.25;
    letter-spacing: -0.01em;
    color: var(--ink);
    margin: 0 0 8px 0;
}
#iap-custody-dots p.dek {
    font-size: 14px;
    line-height: 1.45;
    color: var(--ink-muted);
    margin: 0 0 18px 0;
}
#iap-custody-dots .ds-key {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 6px 16px;
    font-family: var(--sans-sm);
    font-weight: 500;
    font-size: var(--t-small);
    margin: 0 0 1.25rem;
    padding: 0;
    list-style: none;
}
#iap-custody-dots .ds-key span { display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; }
#iap-custody-dots .ds-key em { font-style: italic; color: var(--ink-muted); }
#iap-custody-dots .ds-key .key { width: 12px; height: 12px; border-radius: 50%; flex: none; }
#iap-custody-dots .ds-key .key.counted { background: var(--steel); }
#iap-custody-dots .ds-key .key.uncounted { background: var(--maroon); }
#iap-custody-dots .ds-key .key.unknown { background: var(--sage); }
#iap-custody-dots .ds-key .key.has-story { box-shadow: 0 0 0 1.8px var(--ground), 0 0 0 3.1px var(--ink); }
#iap-custody-dots .dots-wrap {
    position: relative;
    max-width: 24.875rem;
    margin-inline: auto;
    padding-left: 52px;
}
#iap-custody-dots .dots {
    display: grid;
    grid-template-columns: repeat(12, 1fr);
    gap: 13px;
    width: 100%;
    align-items: center;
}
#iap-custody-dots .ylabel {
    position: absolute;
    left: 0;
    width: 26px;
    text-align: right;
    font-family: var(--sans-sm);
    font-size: var(--t-micro);
    font-weight: 500;
    letter-spacing: .06em;
    color: var(--ink-muted);
    line-height: 1;
    white-space: nowrap;
    transform: translateY(-50%);
    pointer-events: none;
    opacity: 0;
    transition: opacity .2s ease;
}
#iap-custody-dots .years-placed .ylabel { opacity: 1; }
#iap-custody-dots .dots .dot {
    appearance: none;
    -webkit-appearance: none;
    padding: 0;
    margin: 0;
    border: 0;
    background: none;
    aspect-ratio: 1 / 1;
    width: 100%;
    border-radius: 50%;
    cursor: pointer;
    position: relative;
    transition: opacity .16s ease, transform .12s ease;
}
#iap-custody-dots .dots .dot::before { content: ""; position: absolute; inset: -6px; border-radius: 50%; }
#iap-custody-dots .dots .dot::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: var(--steel);
    transition: box-shadow .12s ease;
}
#iap-custody-dots .dots .dot.uncounted::after { background: var(--maroon); }
#iap-custody-dots .dots .dot.unknown::after { background: var(--sage); }
#iap-custody-dots .dots .dot.has-story::after { box-shadow: 0 0 0 1.8px var(--ground), 0 0 0 3.2px var(--ink); }
#iap-custody-dots .dots .dot:hover,
#iap-custody-dots .dots .dot:focus-visible,
#iap-custody-dots .dots .dot.is-open { transform: scale(1.35); z-index: 2; outline: none; }
#iap-custody-dots .dots .dot:hover::after,
#iap-custody-dots .dots .dot.is-open::after { box-shadow: 0 0 0 2px var(--ink); }
#iap-custody-dots .dots .dot.has-story:hover::after,
#iap-custody-dots .dots .dot.has-story.is-open::after { box-shadow: 0 0 0 1.8px var(--ground), 0 0 0 3.6px var(--ink); }
#iap-custody-dots .dots .dot:focus-visible::after { box-shadow: 0 0 0 2px var(--ground), 0 0 0 4px var(--ink); }
#iap-custody-dots .dot-pop {
    position: absolute;
    z-index: 50;
    width: min(17.5rem, 100%);
    background: var(--parchment);
    border: var(--rule);
    border-radius: 14px;
    padding: .85rem .9rem .9rem;
    text-align: left;
}
#iap-custody-dots .dot-pop[hidden] { display: none; }
#iap-custody-dots .dot-pop[data-status="uncounted"] { border-color: var(--maroon); }
#iap-custody-dots .dot-pop-arrow {
    position: absolute;
    width: 9px;
    height: 9px;
    background: var(--parchment);
    border-left: 2px solid var(--ink);
    border-top: 2px solid var(--ink);
}
#iap-custody-dots .dot-pop[data-status="uncounted"] .dot-pop-arrow { border-color: var(--maroon); }
#iap-custody-dots .dot-pop-hed {
    font-family: var(--sans);
    font-weight: 600;
    font-size: var(--t-ui);
    line-height: 1.2;
    margin: 0 .4rem .3rem 0;
    padding-right: .9rem;
}
#iap-custody-dots .dot-pop-meta {
    font-family: var(--sans-sm);
    font-weight: 500;
    font-size: var(--t-small);
    line-height: 1.45;
    color: var(--ink-muted);
    margin: 0;
}
#iap-custody-dots .dot-pop-blurb {
    font-size: var(--t-small);
    line-height: 1.45;
    margin: .6rem 0 0;
    padding-top: .55rem;
    border-top: 1px solid var(--ink-muted);
}
#iap-custody-dots .dot-pop-blurb[hidden] { display: none; }
#iap-custody-dots .dot-pop-supp {
    font-family: var(--sans-sm);
    font-style: italic;
    font-size: var(--t-small);
    line-height: 1.45;
    color: var(--ink-muted);
    margin: .45rem 0 0;
}
#iap-custody-dots .dot-pop-supp[hidden] { display: none; }
#iap-custody-dots .dot-pop-credit {
    font-family: var(--sans-sm);
    font-size: var(--t-micro);
    color: var(--ink-muted);
    margin: -.25rem 0 .5rem;
}
#iap-custody-dots .dot-pop-credit[hidden] { display: none; }
#iap-custody-dots .suppression-note {
    font-family: var(--sans-sm);
    font-size: var(--t-small);
    color: var(--ink-muted);
    text-align: center;
    margin: 1.25rem 0 0;
}
#iap-custody-dots .suppression-note[hidden] { display: none; }
#iap-custody-dots .dot-pop-photo {
    display: block;
    width: 8rem;
    aspect-ratio: 4 / 5;
    object-fit: cover;
    border-radius: 8px;
    margin: 0 0 .5rem;
    background: rgba(31, 22, 26, .07);
}
#iap-custody-dots .dot-pop-photo[hidden] { display: none !important; }
#iap-custody-dots .dot-pop-close {
    position: absolute;
    top: .1rem;
    right: .2rem;
    border: 0;
    background: none;
    cursor: pointer;
    font-size: 1rem;
    line-height: 1;
    color: var(--ink-muted);
    padding: .2rem .3rem;
    font-family: var(--sans);
}
#iap-custody-dots .dot-pop-close:hover { color: var(--ink); }
#iap-custody-dots .sr {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
    border: 0;
}
@media (max-width: 500px) {
    #iap-custody-dots { padding: 15px 15px 25px 15px; }
    #iap-custody-dots h1 { font-size: 18px; }
    #iap-custody-dots p.dek { font-size: 12.5px; margin-bottom: 14px; }
}
</style>

<h1>More than one in four people who died in Illinois county jails between 2019 and 2025 were not counted in state data</h1>
<p class="dek">Click a dot to learn more about individuals who died in jail custody.</p>

<p class="ds-key"></p>

<div class="dots-wrap">
    <div class="dots" role="group"></div>
    <div class="dot-pop" role="dialog" aria-modal="false" hidden>
        <span class="dot-pop-arrow" aria-hidden="true"></span>
        <button type="button" class="dot-pop-close" aria-label="Close">&times;</button>
        <img class="dot-pop-photo" alt="" hidden>
        <p class="dot-pop-credit" hidden></p>
        <p class="dot-pop-hed"></p>
        <p class="dot-pop-meta"></p>
        <p class="dot-pop-supp" hidden></p>
        <p class="dot-pop-blurb" hidden></p>
    </div>
</div>

<p class="suppression-note" hidden></p>

<script>
(function () {
    var root = document.getElementById("iap-custody-dots");
    if (!root || root.dataset.ready) return;
    root.dataset.ready = "1";

    var SUPPRESSED_ONE = "Illinois Answers withheld this name at the request of this person's family.";
    var SUPPRESSED_ALL = "Illinois Answers withheld the names of some of the deceased at the request of their families.";

    var STATUS_LABEL = {
        counted: "Counted in the state's official total",
        uncounted: "Never counted by the state",
        unknown: "Counted status unrecorded"
    };

    function parseCSV(text) {
        var rows = [];
        var row = [];
        var field = "";
        var quoted = false;
        var i = 0;
        text = text.replace(/^\uFEFF/, "");
        while (i < text.length) {
            var c = text[i];
            if (quoted) {
                if (c === '"') {
                    if (text[i + 1] === '"') { field += '"'; i += 2; continue; }
                    quoted = false; i++; continue;
                }
                field += c; i++; continue;
            }
            if (c === '"') { quoted = true; i++; continue; }
            if (c === ",") { row.push(field); field = ""; i++; continue; }
            if (c === "\r") { i++; continue; }
            if (c === "\n") { row.push(field); rows.push(row); row = []; field = ""; i++; continue; }
            field += c; i++;
        }
        if (field.length || row.length) { row.push(field); rows.push(row); }
        if (!rows.length) return [];
        var head = rows.shift().map(function (h) { return h.trim(); });
        return rows.filter(function (r) {
            return r.some(function (v) { return String(v).trim() !== ""; });
        }).map(function (r) {
            var o = {};
            head.forEach(function (h, n) { o[h] = (r[n] == null ? "" : String(r[n]).trim()); });
            return o;
        });
    }

    function photoSrc(f) {
        if (!f) return "";
        if (/^https?:\/\//.test(f)) return f;
        var base = root.dataset.photoBase || "";
        if (!base) return "";
        return base.replace(/\/$/, "") + "/" + f.split("/").map(encodeURIComponent).join("/");
    }

    function statusOf(v) {
        if (v === "1") return "counted";
        if (v === "0") return "uncounted";
        return "unknown";
    }

    function describe(d) {
        return [
            d.name || (d.suppressed ? "Name withheld" : null),
            d.age ? String(d.age) : null,
            d.county ? d.county + " County jail" : null,
            d.year || "year unrecorded",
            STATUS_LABEL[d.status]
        ].filter(Boolean).join(" \u00b7 ");
    }

    function plural(n, s) { return n + " " + (n === 1 ? s : s + "s"); }

    fetch(root.dataset.csv).then(function (r) {
        if (!r.ok) throw new Error(r.status);
        return r.text();
    }).then(function (text) {
        var rows = parseCSV(text).map(function (r, i) {
            return {
                i: i,
                name: r.name || "",
                year: r.year ? Number(r.year) : null,
                age: r.age || "",
                county: r.jail || r.county || "",
                story: r.blurb || "",
                photo: photoSrc(r.photo),
                credit: r.photoCredit || "",
                suppressed: String(r.idSuppressed || "").trim() !== "",
                status: statusOf(r.counted)
            };
        });
        render(rows);
    }).catch(function () {
        root.querySelector(".dots").innerHTML = "";
    });

    function render(dots) {
        dots.sort(function (a, b) {
            var ay = a.year == null ? Infinity : a.year;
            var by = b.year == null ? Infinity : b.year;
            return (ay - by) || (a.i - b.i);
        });

        var seen = null;
        dots.forEach(function (d) {
            if (d.year && d.year !== seen) { d.startsYear = d.year; seen = d.year; }
        });

        var counted = dots.filter(function (d) { return d.status === "counted"; }).length;
        var uncounted = dots.filter(function (d) { return d.status === "uncounted"; }).length;
        var unknown = dots.filter(function (d) { return d.status === "unknown"; }).length;
        var withStory = dots.filter(function (d) { return d.story || d.photo; }).length;
        var suppressed = dots.filter(function (d) { return d.suppressed; }).length;

        var note = root.querySelector(".suppression-note");
        if (suppressed > 0) { note.textContent = SUPPRESSED_ALL; note.hidden = false; }

        var key = root.querySelector(".ds-key");
        var keyHtml = "";
        if (counted > 0) keyHtml += '<span><i class="key counted" aria-hidden="true"></i> Counted by the state</span>';
        if (uncounted > 0) keyHtml += '<span><i class="key uncounted" aria-hidden="true"></i> Uncounted</span>';
        if (unknown > 0) keyHtml += '<span><i class="key unknown" aria-hidden="true"></i> Counted status not yet recorded</span>';
        if (withStory > 0) keyHtml += '<span><i class="key ' + (unknown > 0 ? "unknown" : "counted") + ' has-story" aria-hidden="true"></i> <em>Additional details</em></span>';
        key.innerHTML = keyHtml;

        var wrap = root.querySelector(".dots-wrap");
        var grid = root.querySelector(".dots");

        grid.setAttribute("aria-label",
            "Every death, in order, by year. " + plural(dots.length, "person") +
            " died in Illinois county jails. " + counted + " appear in the state's official count. " +
            uncounted + " were never counted by the state.");

        var frag = document.createDocumentFragment();
        dots.forEach(function (d) {
            var b = document.createElement("button");
            b.type = "button";
            b.className = "dot " + d.status + ((d.story || d.photo) ? " has-story" : "");
            b.title = describe(d);
            b.setAttribute("aria-expanded", "false");
            b.dataset.status = d.status;
            b.dataset.statusLabel = STATUS_LABEL[d.status];
            if (d.county) b.dataset.county = d.county;
            if (d.year) b.dataset.year = d.year;
            if (d.name) b.dataset.name = d.name;
            if (d.age) b.dataset.age = d.age;
            if (d.photo) b.dataset.photo = d.photo;
            if (d.credit) b.dataset.credit = d.credit;
            if (d.suppressed) b.dataset.suppressed = "1";
            if (d.story) b.dataset.story = d.story;
            if (d.startsYear) b.dataset.startsYear = d.startsYear;
            var sr = document.createElement("span");
            sr.className = "sr";
            sr.textContent = describe(d);
            b.appendChild(sr);
            frag.appendChild(b);
        });
        grid.appendChild(frag);

        dots.filter(function (d) { return d.startsYear; }).forEach(function (d) {
            var s = document.createElement("span");
            s.className = "ylabel";
            s.dataset.forYear = d.startsYear;
            s.setAttribute("aria-hidden", "true");
            s.textContent = d.startsYear;
            wrap.appendChild(s);
        });

        wire(wrap, grid);
    }

    function wire(wrap, grid) {
        var pop = wrap.querySelector(".dot-pop");
        var arrow = pop.querySelector(".dot-pop-arrow");
        var photo = pop.querySelector(".dot-pop-photo");
        var hed = pop.querySelector(".dot-pop-hed");
        var meta = pop.querySelector(".dot-pop-meta");
        var blurb = pop.querySelector(".dot-pop-blurb");
        var supp = pop.querySelector(".dot-pop-supp");
        var credit = pop.querySelector(".dot-pop-credit");
        var closeBtn = pop.querySelector(".dot-pop-close");

        var marks = [].slice.call(wrap.querySelectorAll(".ylabel")).map(function (el) {
            return { el: el, dot: wrap.querySelector('.dot[data-starts-year="' + el.dataset.forYear + '"]') };
        }).filter(function (m) { return m.dot; });

        function placeYears() {
            var prev = -Infinity;
            marks.forEach(function (m) {
                var top = m.dot.offsetTop + m.dot.offsetHeight / 2;
                if (top - prev < 12) top = prev + 12;
                m.el.style.top = top + "px";
                prev = top;
            });
            wrap.classList.add("years-placed");
        }

        placeYears();
        if (window.ResizeObserver) new ResizeObserver(placeYears).observe(grid);
        else window.addEventListener("resize", placeYears);
        if (document.fonts && document.fonts.ready) document.fonts.ready.then(placeYears);

        var open = null;

        function close() {
            if (!open) return;
            open.classList.remove("is-open");
            open.setAttribute("aria-expanded", "false");
            open = null;
            pop.hidden = true;
        }

        function show(dot) {
            if (open === dot) return close();
            close();
            var d = dot.dataset;

            if (d.photo) { photo.src = d.photo; photo.alt = d.name || ""; photo.hidden = false; }
            else { photo.hidden = true; photo.removeAttribute("src"); }
            photo.onerror = function () { photo.hidden = true; };

            credit.hidden = !(d.photo && d.credit);
            credit.textContent = d.credit || "";

            hed.textContent = d.name || (d.county ? d.county + " County" : d.statusLabel);
            var bits = [];
            if (d.age) bits.push(d.age);
            if (d.name && d.county) bits.push(d.county + " County");
            bits.push(d.year || "Year unrecorded");
            if (hed.textContent !== d.statusLabel && d.status !== "unknown") bits.push(d.statusLabel);
            meta.textContent = bits.join(" \u00b7 ");

            supp.hidden = !d.suppressed;
            supp.textContent = d.suppressed ? SUPPRESSED_ONE : "";

            blurb.hidden = !d.story;
            blurb.textContent = d.story || "";

            pop.hidden = false;
            pop.dataset.status = d.status;
            dot.classList.add("is-open");
            dot.setAttribute("aria-expanded", "true");
            open = dot;

            var wb = wrap.getBoundingClientRect();
            var db = dot.getBoundingClientRect();
            var pw = pop.offsetWidth;
            var ph = pop.offsetHeight;
            var cx = db.left - wb.left + db.width / 2;
            var cy = db.top - wb.top;

            var left = Math.max(0, Math.min(cx - pw / 2, wrap.clientWidth - pw));
            var above = cy - ph - 10 >= 0;
            pop.style.left = left + "px";
            pop.style.top = (above ? cy - ph - 10 : cy + db.height + 10) + "px";

            arrow.style.left = Math.max(18, Math.min(cx - left - 5, pw - 27)) + "px";
            arrow.style.top = above ? (ph - 5) + "px" : "-5px";
            arrow.style.transform = above ? "rotate(225deg)" : "rotate(45deg)";
        }

        grid.addEventListener("click", function (e) {
            var dot = e.target.closest(".dot");
            if (!dot) return;
            e.stopPropagation();
            show(dot);
        });

        closeBtn.addEventListener("click", function () { var d = open; close(); if (d) d.focus(); });
        document.addEventListener("click", function (e) {
            if (!e.target.closest("#iap-custody-dots .dot-pop")) close();
        });
        document.addEventListener("keydown", function (e) {
            if (e.key === "Escape" && open) { var d = open; close(); d.focus(); }
        });
        window.addEventListener("resize", close);
    }
})();
</script>
</div>

<script>
(function () {
    if (window.parent === window) return;
    var last = 0;
    function send() {
        var h = Math.ceil(document.documentElement.getBoundingClientRect().height);
        if (!h || Math.abs(h - last) < 2) return;
        last = h;
        window.parent.postMessage({ type: "iap-graphic-height", id: "inCustodyDeaths", height: h }, "*");
    }
    window.addEventListener("load", send);
    window.addEventListener("resize", send);
    if (window.ResizeObserver) new ResizeObserver(send).observe(document.body);
    setTimeout(send, 300);
    setTimeout(send, 1200);
})();
</script>
</body>
